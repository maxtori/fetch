[package]
name = "fetch_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
gzip = ["reqwest/gzip"]

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "net", "macros"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[profile.release]
lto = "thin"
